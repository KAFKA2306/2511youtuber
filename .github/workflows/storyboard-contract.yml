name: Storyboard contract

on:
  pull_request:
    paths:
      - "src/storyboard.py"
      - "src/providers/video_generation.py"
      - "tests/test_storyboard_video_generation.py"
      - ".github/workflows/storyboard-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install "pydantic>=2,<3" "requests>=2.31" "pytest>=8" "ruff>=0.1"
      - name: Run Storyboard tests
        run: python -m pytest tests/test_storyboard_video_generation.py -q
      - name: Lint Storyboard boundary
        run: >-
          ruff check
          src/storyboard.py
          src/providers/video_generation.py
          tests/test_storyboard_video_generation.py
