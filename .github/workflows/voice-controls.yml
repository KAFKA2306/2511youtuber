name: Voice controls

on:
  pull_request:
    paths:
      - "config/voice_prompt_contract.txt"
      - "src/providers/llm.py"
      - "src/providers/tts.py"
      - "src/steps/script.py"
      - "tests/unit/test_voice_controls.py"
      - "tests/unit/test_voice_prompt_contract.py"
      - ".github/workflows/voice-controls.yml"
  push:
    branches: [main]
    paths:
      - "config/voice_prompt_contract.txt"
      - "src/providers/llm.py"
      - "src/providers/tts.py"
      - "src/steps/script.py"
      - "tests/unit/test_voice_controls.py"
      - "tests/unit/test_voice_prompt_contract.py"
      - ".github/workflows/voice-controls.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest requests pydub pyyaml pydantic litellm
      - name: Compile voice and prompt path
        run: python -m py_compile src/providers/llm.py src/providers/tts.py src/steps/script.py
      - name: Test inline VOICE controls and prompt emitter
        run: python -m pytest -q tests/unit/test_voice_controls.py tests/unit/test_voice_prompt_contract.py
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
