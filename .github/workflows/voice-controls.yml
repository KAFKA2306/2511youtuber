name: Voice controls

on:
  pull_request:
    paths:
      - "src/providers/tts.py"
      - "tests/unit/test_voice_controls.py"
      - ".github/workflows/voice-controls.yml"
  push:
    branches: [main]
    paths:
      - "src/providers/tts.py"
      - "tests/unit/test_voice_controls.py"
      - ".github/workflows/voice-controls.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest requests pydub
      - name: Compile provider
        run: python -m py_compile src/providers/tts.py
      - name: Test inline VOICE controls
        run: python -m pytest -q tests/unit/test_voice_controls.py
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
