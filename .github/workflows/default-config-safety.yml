name: Default config safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-publishing-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2,<3" PyYAML Pillow ffmpeg-python pydub
      - name: Validate publication defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          raw = yaml.safe_load(Path("config/default.yaml").read_text(encoding="utf-8"))
          steps = raw["steps"]
          assert isinstance(steps["news"], dict)
          assert steps["metadata"]["enabled"] is True
          assert steps["youtube"]["enabled"] is True
          assert steps["youtube"]["dry_run"] is False
          assert steps["youtube"]["default_visibility"] == "public"
          assert steps["twitter"]["enabled"] is False
          assert steps["linkedin"]["enabled"] is False
          assert steps["hatena"]["enabled"] is False
          assert raw["automation"]["enabled"] is False

          tone = raw["tone"]
          assert tone["enabled"] is True
          assert tone["title_forbidden_terms"]
          assert tone["description_forbidden_terms"]
          replacements = tone["replacements"]
          for term in set(tone["title_forbidden_terms"] + tone["description_forbidden_terms"]):
              assert term in replacements, f"missing tone replacement: {term}"
              assert replacements[term].strip(), f"empty tone replacement: {term}"
          marker = tone["failure_transparency_marker"].strip()
          footer = tone["description_footer"].strip()
          assert marker
          assert marker in footer
          PY
      - name: Validate prompt version provenance
        run: python -m unittest tests/unit/test_prompt_version.py -v
      - name: Validate context-note history
        run: python -m unittest tests/unit/test_context_notes.py -v
      - name: Validate subtitle pagination
        run: python -m unittest tests/unit/steps/test_subtitle_pagination.py -v
