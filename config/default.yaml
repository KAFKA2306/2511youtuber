workflow:
  default_run_dir: "runs"
  checkpoint_enabled: false

steps:
  news:
    query_buckets:
      macro_economy: "GDP CPI 雇用統計 金融政策 日銀 FRB インフレ 景気動向"
      japanese_stock: "日経平均 TOPIX 日本株 決算 上方修正 自社株買い 株式分割"
      us_stock: "米国株 NYダウ S&P500 NASDAQ 決算 米国経済"
      forex_rates: "ドル円 為替 円安 円高 金利差 為替介入"
      commodities: "原油価格 金相場 商品先物 エネルギー価格"
      crypto_web3: "ビットコイン 暗号資産 イーサリアム ブロックチェーン"
      tech_semicon: "半導体 生成AI 人工知能 テクノロジー"
    fetch_count: 10
    final_count: 3
    cooldown_hours: 24
    count: 3
    recent_topics_runs: 5
    recent_topics_max_chars: 500
    recent_topics_min_token_length: 2
    recent_topics_stopwords: []

  script:
    min_duration: 300
    max_duration: 600
    target_wow_score: 5.0
    speakers:
      analyst:
        name: "春日部つむぎ"
        aliases: ["春日部つむぎ", "つむぎ"]
      reporter:
        name: "ずんだもん"
        aliases: ["ずんだもん"]
      narrator:
        name: "玄野武宏"
        aliases: ["玄野武宏", "ナレーター"]

  audio:
    sample_rate: 24000
    format: "wav"

  subtitle:
    width_per_char_pixels: 70
    min_visual_width: 16
    max_visual_width: 40

  video:
    resolution: "1920x1080"
    fps: 25
    codec: "libx264"
    preset: "medium"
    encoder_options:
      pix_fmt: "yuv420p"
      acodec: "aac"
    encoder_global_args: []
    effects: []
    intro_outro:
      enabled: false
    thumbnail_overlay:
      enabled: false
      duration_seconds: 0
      source_key: "generate_thumbnail"
    subtitles:
      font_name: "sans-serif"
      font_size: 72
      primary_colour: "&HFFFFFF&"
      outline_colour: "&H000000&"
      outline: 2
      alignment: 2
      margin_l: 0
      margin_r: 0
      margin_v: 10

  thumbnail:
    enabled: false
    width: 1280
    height: 720
    background_color: "#fef155"
    title_color: "#EB001B"
    subtitle_color: "#EB001B"
    safe_margin_pct: 9
    title_height_min_pct: 30
    title_height_max_pct: 40
    preview_width: 200
    outline_inner_color: "#FFFFFF"
    outline_inner_width: 3
    outline_outer_color: "#000000"
    outline_outer_width: 6
    padding: 80
    max_lines: 4
    max_chars_per_line: 12
    title_font_size: 288
    subtitle_font_size: 56
    font_path: "assets/fonts/ZenMaruGothic-Bold.ttf"
    overlays: []

  thumbnail_ai:
    enabled: false
    width: 1920
    height: 1080
    num_steps: 6

  scene_generator:
    enabled: false
    images_per_video: 4
    variants_per_type: 2
    width: 1280
    height: 720
    num_steps: 9
    scene_duration_seconds: 30
    model_path: "external/hf-cache-hub/models/Z-Image-Turbo"
    device: "cuda"

  metadata:
    enabled: true
    use_llm: true
    llm_model: null
    fallback_llm_model: null
    target_keywords: ["金融", "経済", "投資", "株"]
    max_title_length: 50
    max_description_length: 5000
    default_tags: []

  youtube:
    enabled: true
    dry_run: false
    default_visibility: "public"
    category_id: 25
    default_tags: []

  twitter:
    enabled: false
    dry_run: true
    clip_duration_seconds: 60
    start_offset_seconds: 0

  linkedin:
    enabled: false
    dry_run: true

  hatena:
    enabled: false
    dry_run: true

  podcast:
    enabled: false
    feed_title: "金融ニュース解説ポッドキャスト"
    feed_description: "AI生成の日本経済・金融ニュース解説"
    feed_author: "2511 YouTuber AI"
    feed_url: "https://example.invalid/podcast"

  buzzsprout:
    enabled: false
    podcast_id: null
    token_key: "buzzsprout_api_token"
    podcast_id_key: "buzzsprout_podcast_id"
    title_template: "金融ニュース解説 Episode {run_id}"
    publish_immediately: false

providers:
  llm:
    gemini:
      model: "gemini/gemini-2.5-flash"
      fallback_model: null
      temperature: 0.2
      max_tokens: 32768

  tts:
    voicevox:
      enabled: false
      url: "http://localhost:50121"
      manager_script: "scripts/voicevox_manager.sh"
      auto_start: false
      speakers:
        春日部つむぎ: 8
        ずんだもん: 1
        玄野武宏: 11
      voice_parameters: {}

  news:
    perplexity:
      enabled: false
      model: "sonar"
      temperature: 0.2
      max_tokens: 2048
      search_recency_filter: "week"

tone:
  # Low & Slow: 等身大の検証過程を共有する。釣り・煽り・過度な自画自賛は避け、
  # 失敗も含めた透明性を担保する。
  enabled: true
  title_forbidden_terms:
    - "神回"
    - "覇権"
    - "完全勝利"
    - "最強"
  description_forbidden_terms:
    - "絶対に成功"
    - "確実に儲かる"
    - "必ず成功"
    - "完全勝利"
  replacements:
    "神回": "検証ログ"
    "覇権": "検証中"
    "完全勝利": "検証で得られた知見"
    "最強": "現時点の手応え"
    "絶対に成功": "成功条件を検証"
    "確実に儲かる": "再現性を検証"
    "必ず成功": "成功条件を検証"
  description_footer: "このチャンネルはLow & Slow。失敗や未検証の点も含めて、再現できる範囲を正直に共有します。"
  failure_transparency_marker: "失敗や未検証"

logging:
  level: "INFO"
  format: "json"

automation:
  enabled: false
  venv_activate: ".venv/bin/activate"
  log_dir: "logs/automation"
  services: []
  schedules: []
